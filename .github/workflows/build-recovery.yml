name: Build Recovery ISO image

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: 'Select a macOS version to build'
        required: true
        type: choice
        options:
          - ''
          - 'Tahoe'
          - 'Sequoia'
          - 'Sonoma'
          - 'Ventura'
          - 'Monterey'
          - 'Big Sur'
          - 'Catalina'
          - 'Mojave'
          - 'High Sierra'
      release_tag:
        description: 'Optional: tag the build (e.g., v10.15) to upload it to Releases for long-term storage'
        required: false
        type: string

concurrency:
  group: recovery-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-recovery-iso:
    if: ${{ inputs.macos_version != '' }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: System Information
        run: |
          echo "Runner OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo ""
          df -h $(mktemp)
          echo ""
          echo "RAM: $(top -l 1 | grep PhysMem)"
          echo ""
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo ""
          echo "Python version: $(python3 --version)"

      - name: Download macrecovery.py
        run: |
          echo "Downloading macrecovery.py from acidanthera/OpenCorePkg..."
          curl --retry 3 --max-time 10 --connect-timeout 3 -OL "https://raw.githubusercontent.com/acidanthera/OpenCorePkg/master/Utilities/macrecovery/macrecovery.py"

      - name: Get version info
        id: version_info
        run: |
          ROW=$(awk -F'\t' -v want="${{ inputs.macos_version }}" '
            /^#/ { next }
            NF < 10 { next }
            $2 == want { print; exit }
          ' versions.tsv)

          if [ -z "$ROW" ]; then
            echo "::error::No row for '${{ inputs.macos_version }}' in versions.tsv"
            exit 1
          fi

          IFS=$'\t' read -r CODENAME NAME VER YEAR APP KIND URL BOARD MODEL OS <<< "$ROW"

          if [ -z "$BOARD" ] || [ "$BOARD" = "-" ]; then
            echo "::error::No recovery identifiers for $NAME in versions.tsv"
            exit 1
          fi

          OS_FLAG=""
          if [ "$OS" != "-" ]; then OS_FLAG="$OS"; fi

          echo "board_id=$BOARD" >> $GITHUB_OUTPUT
          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "version_name=$(printf '%s' "$NAME" | tr ' ' '_')" >> $GITHUB_OUTPUT
          echo "os_flag=$OS_FLAG" >> $GITHUB_OUTPUT

      - name: Download macOS Recovery
        id: download_recovery_image
        run: |
          echo "Downloading macOS ${{ steps.version_info.outputs.version_name }} recovery..."

          if [ -n "${{ steps.version_info.outputs.os_flag }}" ]; then
            script -q /dev/null python3 macrecovery.py -b "${{ steps.version_info.outputs.board_id }}" -m "${{ steps.version_info.outputs.model }}" -os "${{ steps.version_info.outputs.os_flag }}" download
          else
            script -q /dev/null python3 macrecovery.py -b "${{ steps.version_info.outputs.board_id }}" -m "${{ steps.version_info.outputs.model }}" download
          fi

      - name: Create Recovery ISO
        id: create_iso
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          ISO_FILE="macOS_${VERSION_NAME}_Recovery.iso"
          RECOVERY_PATH="com.apple.recovery.boot/BaseSystem.dmg"

          sudo hdiutil makehybrid -hfs -udf -default-volume-name "${VERSION_NAME}_Recovery" -o "$ISO_FILE" "$RECOVERY_PATH"

          if [ -f "$ISO_FILE" ]; then
            ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
            echo "ISO created successfully!"
            echo "ISO size: $ISO_SIZE"
            echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Compress ISO
        id: compress_iso
        run: |
          ISO_FILE="${{ steps.create_iso.outputs.iso_file }}"
          ZIP_FILE="${ISO_FILE}.zip"

          echo "Compressing ISO with zip..."
          zip -j "$ZIP_FILE" "$ISO_FILE"
          echo "compressed_file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Upload Recovery ISO artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.compress_iso.outputs.compressed_file }}
          compression-level: 0
          retention-days: 15
          archive: false

      - name: Sanitize release tag
        id: sanitize_tag
        if: inputs.release_tag != ''
        run: |
          sanitized_tag=$(printf '%s' "${{ inputs.release_tag }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          echo "sanitized_tag=$sanitized_tag" >> $GITHUB_OUTPUT

      - name: Create Release
        if: inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
          TAG: ${{ steps.sanitize_tag.outputs.sanitized_tag }}
          ASSET: ${{ steps.compress_iso.outputs.compressed_file }}
        continue-on-error: true
        run: |
          gh release create "$TAG" \
            --title "macOS ${VERSION_NAME} Recovery" \
            "$ASSET"

      - name: Summary
        if: always()
        run: |
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "${{ steps.download_recovery_image.outcome }}" == "failure" ]; then
            sum "## Download RecoveryOS failed" \
                "" \
                "> [!WARNING]" \
                "> This runner may have network issues. Please **re-run the workflow** to try a different runner."
          elif [ "${{ job.status }}" == "success" ]; then
            sum "## Successfully built **macOS ${{ steps.version_info.outputs.version_name }} Recovery** ISO" \
                "" \
                "> [!Important]" \
                "> This ISO image is intended for creating macOS virtual machine on Proxmox VE, QEMU, and VMware." \
                "" \
                "> [!TIP]" \
                "> Enable [Cloudflare WARP](https://one.one.one.one/) for faster download from GitHub artifact."
          fi
